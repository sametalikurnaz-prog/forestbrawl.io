name: Deploy API to Fly

on:
  push:
    paths:
      - 'artifacts_unpacked/artifacts/api-server/**'
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly
        uses: superfly/flyctl-actions@v1
        with:
          args: deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: artifacts_unpacked/artifacts/api-server
